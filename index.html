<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #canvasContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #imageCanvas {
            display: block;
            background: #2d2d2d;
            cursor: grab;
        }
        
        #imageCanvas:active {
            cursor: grabbing;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
        }
        
        .marker-info {
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            color: white;
            max-width: 300px;
            z-index: 100;
            display: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }
        
        .marker-info h3 {
            margin-bottom: 8px;
            color: #3498db;
        }
        
        .marker-info p {
            font-size: 14px;
            line-height: 1.4;
        }
        
        .close-btn {
            position: absolute;
            top: 5px;
            right: 10px;
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div id="canvasContainer">
        <canvas id="imageCanvas"></canvas>
        <div class="loading" id="loadingText">加载中...</div>
        <div class="marker-info" id="markerInfo">
            <button class="close-btn">&times;</button>
            <h3 id="markerTitle"></h3>
            <p id="markerDescription"></p>
        </div>
    </div>

    <script>
        // 全局变量
        let scale = 1;
        let minScale = 0.1;
        let maxScale = 5;
        let translateX = 0;
        let translateY = 0;
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let markers = [];
        let isAddingMarker = false;
        let currentImage = null;
        let hoveredButton = null;
        let hoveredMarker = null;
        
        // 按钮定义
        const buttons = [
            { id: 'zoomIn', x: 20, y: 20, width: 40, height: 40, text: '+', tooltip: '放大' },
            { id: 'zoomOut', x: 70, y: 20, width: 40, height: 40, text: '-', tooltip: '缩小' },
            { id: 'resetView', x: 120, y: 20, width: 40, height: 40, text: '↻', tooltip: '重置视图' },
            { id: 'addMarker', x: 170, y: 20, width: 40, height: 40, text: '📌', tooltip: '添加标记' }
        ];
        const icon_img = {
            shield: {
                url: "./icons/shield.png",
                width: 20,
                height: 20,
                loaded: false,
                image: null
            }
            ,
            point: {
                url: "./icons/point.png",
                width: 20,
                height: 20,
                loaded: false,
                image: null
            },
            monument:{
                url: "./icons/monument.png",
                width: 20,
                height: 20,
                loaded: false,
                image: null
            },
            treasure:{
                url: "./icons/treasure.png",
                width: 20,
                height: 20,
                loaded: false,
                image: null
            },
            wizard:{
                url: "./icons/wizard.png",
                width: 20,
                height: 20,
                loaded: false,
                image: null
            },
            gov:{
                url: "./icons/gov.png",
                width: 20,
                height: 20,
                loaded: false,
                image: null
            },
            temple:{
                url: "./icons/temple.png",
                width: 20,
                height: 20,
                loaded: false,
                image: null
            },
            idk:{
                url: "./icons/idk.png",
                width: 20,
                height: 20,
                loaded: false,
                image: null
            },
            dragon:{
                url: "./icons/dragon.png",
                width: 20,
                height: 20,
                loaded: false,
                image: null
            },
            dungeon:{
                url: "./icons/dungeon.png",
                width: 20,
                height: 20,
                loaded: false,
                image: null
            },
            castle:{
                url: "./icons/castle.png",
                width: 20,
                height: 20,
                loaded: false,
                image: null
            }
        };
        
        // DOM元素
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d');
        const loadingText = document.getElementById('loadingText');
        const markerInfo = document.getElementById('markerInfo');
        const markerTitle = document.getElementById('markerTitle');
        const markerDescription = document.getElementById('markerDescription');
        
        // 初始化Canvas大小
        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        // 加载图片
        function loadImage() {
            currentImage = new Image();
            currentImage.onload = function() {
                loadingText.style.display = 'none';
                draw();
            };
            currentImage.onerror = function() {
                loadingText.textContent = '图片加载失败，使用默认背景';
                currentImage = null;
                draw();
            };
            // 替换为您的图片路径
            currentImage.src = './map-erth.png';
        }
        // 预加载所有标记图片
        function preloadMarkerIcons() {
            const iconPromises = [];
            
            for (const key in icon_img) {
                if (icon_img.hasOwnProperty(key)) {
                    const icon = icon_img[key];
                    icon.image = new Image();
                    icon.loaded = false;
                    
                    const promise = new Promise((resolve, reject) => {
                        icon.image.onload = () => {
                            icon.loaded = true;
                            resolve(icon);
                        };
                        icon.image.onerror = reject;
                    });
                    
                    icon.image.src = icon.url;
                    iconPromises.push(promise);
                }
            }
            
            return Promise.all(iconPromises);
        }
        // 绘制按钮
        function drawButtons() {
            buttons.forEach(button => {
                const isHover = hoveredButton === button.id;
                const isActive = button.id === 'addMarker' && isAddingMarker;
                
                // 按钮背景
                ctx.fillStyle = isActive ? '#e74c3c' : (isHover ? '#34495e' : 'rgba(52, 73, 94, 0.8)');
                ctx.fillRect(button.x, button.y, button.width, button.height);
                
                // 按钮边框
                ctx.strokeStyle = isHover ? '#3498db' : 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 2;
                ctx.strokeRect(button.x, button.y, button.width, button.height);
                
                // 按钮文字
                ctx.fillStyle = 'white';
                ctx.font = '18px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(button.text, button.x + button.width / 2, button.y + button.height / 2);
                
                // 悬停提示
                if (isHover) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                    ctx.fillRect(button.x, button.y + button.height + 5, 80, 25);
                    ctx.fillStyle = 'white';
                    ctx.font = '12px Arial';
                    ctx.fillText(button.tooltip, button.x + 40, button.y + button.height + 18);
                }
            });
        }
        
        // 将屏幕坐标转换为图片坐标
        function screenToImage(x, y) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = x - rect.left;
            const mouseY = y - rect.top;
            
            const imgX = (mouseX - canvas.width / 2) / scale - translateX;
            const imgY = (mouseY - canvas.height / 2) / scale - translateY;
            
            const imgCenterX = currentImage ? currentImage.width / 2 : 0;
            const imgCenterY = currentImage ? currentImage.height / 2 : 0;
            
            return {
                x: imgX + imgCenterX,
                y: imgY + imgCenterY
            };
        }
        
        // 将图片坐标转换为屏幕坐标
        function imageToScreen(x, y) {
            const imgCenterX = currentImage ? currentImage.width / 2 : 0;
            const imgCenterY = currentImage ? currentImage.height / 2 : 0;
            
            const screenX = (x - imgCenterX) * scale + translateX * scale + canvas.width / 2;
            const screenY = (y - imgCenterY) * scale + translateY * scale + canvas.height / 2;
            
            return { x: screenX, y: screenY };
        }
        
        // 检查是否点击了标记
        function checkMarkerClick(x, y) {
            if (!currentImage) return null;
            
            const imgPos = screenToImage(x, y);
            const markerRadius = 30; // 标记的点击半径
            
            for (let i = markers.length - 1; i >= 0; i--) {
                const marker = markers[i];
                const distance = Math.sqrt(
                    Math.pow(imgPos.x - marker.x, 2) + 
                    Math.pow(imgPos.y - marker.y, 2)
                );
                
                // 考虑缩放因素调整点击半径
                const effectiveRadius = markerRadius / scale;
                if (distance < effectiveRadius) {
                    return marker;
                }
            }
            return null;
        }
        
        // 检查鼠标是否悬停在标记上
        function checkMarkerHover(x, y) {
            if (!currentImage) return null;
            const imgPos = screenToImage(x, y);
            const markerRadius = 15; // 标记的悬停半径
            
            for (let i = markers.length - 1; i >= 0; i--) {
                const marker = markers[i];
                const distance = Math.sqrt(
                    Math.pow(imgPos.x - marker.x, 2) + 
                    Math.pow(imgPos.y - marker.y, 2)
                );
                
                // 考虑缩放因素调整悬停半径
                const effectiveRadius = markerRadius / scale;
                if (distance < effectiveRadius) {
                    return marker;
                }
            }
            return null;
        }
        
        // 绘制图片和标记
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 保存当前画布状态
            ctx.save();
            
            // 移动到画布中心
            ctx.translate(canvas.width / 2, canvas.height / 2);
            
            // 应用缩放
            ctx.scale(scale, scale);
            
            // 应用平移
            ctx.translate(translateX, translateY);
            
            // 绘制图片（如果已加载）
            if (currentImage) {
                ctx.drawImage(currentImage, -currentImage.width / 2, -currentImage.height / 2);
                
                // 绘制标记
                markers.forEach(marker => {
                    const x = marker.x - currentImage.width / 2;
                    const y = marker.y - currentImage.height / 2;
                    const isHover = hoveredMarker === marker;
                    const screenPos = imageToScreen(marker.x, marker.y);
                    const icon = icon_img[marker.icontype];
                    
                    if (!icon.loaded) {
                        // 标记点
                        ctx.beginPath();
                        ctx.arc(x, y, 10, 0, Math.PI * 2);
                        ctx.fillStyle = isHover ? '#3498db' : '#e74c3c';
                        ctx.fill();
                        
                        // 标记外圈
                        ctx.beginPath();
                        ctx.arc(x, y, 12, 0, Math.PI * 2);
                        ctx.strokeStyle = 'white';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                    
                    ctx.drawImage(icon.image,  x - icon.width/scale/2, y - icon.height/scale/2, icon.width/scale, icon.height/scale);
                    // 标记名称（在缩放较大时显示）
                    if (scale > 0.5) {
                        ctx.fillStyle = '#ffffff';
                        ctx.font = `${14 / scale}px Arial`;
                        ctx.textAlign = 'center';
                        ctx.fillText(marker.name, x, y + 20 / scale);
                    }
                });
            } else {
                // 绘制默认背景
                ctx.fillStyle = '#34495e';
                ctx.fillRect(-canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
                
                ctx.fillStyle = '#ecf0f1';
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('请设置正确的图片路径', 0, 0);
            }
            
            // 恢复画布状态
            ctx.restore();
            
            // 绘制控制按钮（始终在顶部）
            drawButtons();
            
            // 绘制缩放比例信息
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(20, canvas.height - 40, 120, 30);
            ctx.fillStyle = 'white';
            ctx.font = '14px Arial';
            ctx.fillText(`缩放: ${Math.round(scale * 100)}%`, 80, canvas.height - 25);
            
            // 绘制操作提示
            if (isAddingMarker) {
                ctx.fillStyle = 'rgba(231, 76, 60, 0.8)';
                ctx.fillRect(canvas.width - 200, 20, 180, 30);
                ctx.fillStyle = 'white';
                ctx.font = '14px Arial';
                ctx.fillText('点击图片添加标记', canvas.width - 190, 40);
            }
        }
        
        // 检查点击是否在按钮上
        function checkButtonClick(x, y) {
            for (const button of buttons) {
                if (x >= button.x && x <= button.x + button.width &&
                    y >= button.y && y <= button.y + button.height) {
                    return button.id;
                }
            }
            return null;
        }
        
        // 检查鼠标是否在按钮上悬停
        function checkButtonHover(x, y) {
            for (const button of buttons) {
                if (x >= button.x && x <= button.x + button.width &&
                    y >= button.y && y <= button.y + button.height) {
                    return button.id;
                }
            }
            return null;
        }
        
        // 显示标记信息
        function showMarkerInfo(marker, x, y) {
            markerTitle.textContent = marker.name;
            markerDescription.textContent = marker.description;
            
            // 定位信息框，确保不超出屏幕
            let infoX = x + 10;
            let infoY = y + 10;
            
            if (infoX + 300 > window.innerWidth) {
                infoX = x - 310;
            }
            if (infoY + 150 > window.innerHeight) {
                infoY = y - 160;
            }
            
            markerInfo.style.left = infoX + 'px';
            markerInfo.style.top = infoY + 'px';
            markerInfo.style.display = 'block';
        }
        
        // 鼠标滚轮缩放
        canvas.addEventListener('wheel', function(e) {
            e.preventDefault();
            
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            const imgX = (mouseX - canvas.width / 2) / scale - translateX;
            const imgY = (mouseY - canvas.height / 2) / scale - translateY;
            
            const zoomIntensity = 0.1;
            const wheel = e.deltaY < 0 ? 1 : -1;
            const newScale = scale * Math.pow(1 + zoomIntensity, wheel);
            
            scale = Math.max(minScale, Math.min(maxScale, newScale));
            
            translateX = (mouseX - canvas.width / 2) / scale - imgX;
            translateY = (mouseY - canvas.height / 2) / scale - imgY;
            
            draw();
        });
        
        // 鼠标事件处理
        canvas.addEventListener('mousedown', function(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            // 检查是否点击了按钮
            const clickedButton = checkButtonClick(mouseX, mouseY);
            if (clickedButton) {
                handleButtonClick(clickedButton);
                return;
            }
            
            // 检查是否点击了标记
            const clickedMarker = checkMarkerClick(e.clientX, e.clientY);
            if (clickedMarker) {
                showMarkerInfo(clickedMarker, e.clientX, e.clientY);
                return;
            }
            
            // 添加标记模式
            if (isAddingMarker) {
                addMarkerAtPosition(e);
                return;
            }
            
            // 开始拖拽
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            canvas.style.cursor = 'grabbing';
        });
        
        canvas.addEventListener('mousemove', function(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            // 更新按钮悬停状态
            hoveredButton = checkButtonHover(mouseX, mouseY);
            
            // 更新标记悬停状态
            hoveredMarker = checkMarkerHover(e.clientX, e.clientY);
            
            // 更新光标样式
            if (hoveredButton) {
                canvas.style.cursor = 'pointer';
            } else if (hoveredMarker) {
                canvas.style.cursor = 'pointer';
            } else if (isAddingMarker) {
                canvas.style.cursor = 'crosshair';
            } else if (isDragging) {
                canvas.style.cursor = 'grabbing';
            } else {
                canvas.style.cursor = 'grab';
            }
            
            if (isDragging) {
                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;
                
                translateX += deltaX / scale;
                translateY += deltaY / scale;
                
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                
                draw();
            } else {
                draw(); // 更新悬停效果
            }
        });
        
        canvas.addEventListener('mouseup', function() {
            isDragging = false;
            canvas.style.cursor = hoveredButton || hoveredMarker ? 'pointer' : (isAddingMarker ? 'crosshair' : 'grab');
        });
        
        canvas.addEventListener('mouseout', function() {
            hoveredButton = null;
            hoveredMarker = null;
            if (!isDragging) {
                draw();
            }
        });
        
        // 按钮点击处理
        function handleButtonClick(buttonId) {
            switch(buttonId) {
                case 'zoomIn':
                    scale = Math.min(maxScale, scale + 0.2);
                    break;
                case 'zoomOut':
                    scale = Math.max(minScale, scale - 0.2);
                    break;
                case 'resetView':
                    scale = 1;
                    translateX = 0;
                    translateY = 0;
                    break;
                case 'addMarker':
                    isAddingMarker = !isAddingMarker;
                    break;
            }
            draw();
        }
        
        // 添加标记
        function addMarkerAtPosition(e) {
            const imgPos = screenToImage(e.clientX, e.clientY);
            console.log(imgPos);
            const markerName = `标记 ${markers.length + 1}`;
            const markerDesc = prompt('请输入标记描述:', `这是标记 ${markers.length + 1}`);
            
            if (markerDesc !== null) {
                markers.push({
                    x: imgPos.x,
                    y: imgPos.y,
                    name: markerName,
                    description: markerDesc
                });
            }
            
            isAddingMarker = false;
            draw();
        }
        
        // 关闭标记信息
        document.querySelector('.close-btn').addEventListener('click', function() {
            markerInfo.style.display = 'none';
        });
        
        // 初始化
        window.addEventListener('load', function() {
            initCanvas();
            loadImage();
            preloadMarkerIcons().then(() => {
                console.log('所有标记图片加载完成');
                loadImage();
            }).catch(error => {
                console.error('标记图片加载失败:', error);
                loadImage();
            });
            // 添加示例标记
            markers.push(
                { x: 2825, y: 905, icontype:"point",name: "佩文尼特", description: "艾特琳莎以北的海滨小镇，以不冻港闻名，如今仍然保持着政治独立。此地生产小麦等农作物，人民皆热情好客，无忧无虑，一天要吃6顿饭，且嗜酒如命，各种庆祝活动多如牛毛。" },
                { x: 2856, y: 931, icontype:"idk",name: "无名前哨站", description: "灭亡的丹塔尔的边境前哨站，在狂龙泣血之年便被废弃。最近佩文尼特突然出现了一些传闻：有人在前哨站附近失踪了，镇上的其他人去寻找，却一无所获。" },
                { x: 2765, y: 902, icontype:"point",name: "河叉镇", description: "河叉镇位于佩文尼特西边，卡尼期河在艾特琳莎以南的分岔口处，占地面积远小于佩文尼特。河叉镇位于艾特琳莎到埃瑟利亚的沿河大道上，且拥有着卡尼期河上少数几座跨越河流主干道的桥梁（其建造者与建造时间如今不得而知），常被商队当作休息之处。" },
                { x: 2876, y: 935, icontype:"idk",name: "佩瑞安丘陵", description: "位于佩文尼特东南方的丘陵，传说群山之中仍有北丹塔尔的遗迹存在。然而因为靠近佩文尼特一侧的山坡极其陡峭，难以翻阅，故少有佩文尼特的人前去探索。" },
                { x: 2883, y: 914, icontype:"castle",name: "马赛诸塞城", description: "马萨诸塞城是一座沿海城市,又被称为帮派与佣兵之城，距离佩纹尼特大概一天脚程。" },
                { x: 2599, y: 956, icontype:"idk",name: "席林河", description: "最初发源于艾特琳莎边境线西南的山脉，席林河经过一片如今已经被风滚草占领的平原，最后在埃瑟利亚北部汇入卡尼期河。" },
                { x: 2749, y: 862, icontype:"gov",name: "莫瑞迪诺", description: "艾特琳莎的南方的边境城市，沿河大路的尽头，同时也是进入艾特琳莎国境的一大入口。莫瑞迪诺的占地面积较大于佩文尼特，虽然其规模不如其他的著名城市，但其的确是艾特琳莎气候最适宜之处。" },
                { x: 2647, y: 956, icontype:"monument",name: "图温旧址", description: "已经随过去的岁月消亡的丹塔尔城市，如今只剩下了被风滚草侵占的废墟。" },
            );
            
            // 窗口大小变化时调整Canvas
            window.addEventListener('resize', function() {
                initCanvas();
                draw();
            });
        });
    </script>
</body>

</html>
