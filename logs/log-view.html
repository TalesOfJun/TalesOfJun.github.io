<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 渲染器</title>
    <!-- 引入 marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 可选：代码高亮 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        #markdown-content {
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            padding: 20px;
            margin-top: 20px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>Markdown 文件预览</h1>
    <div id="markdown-content">
        <div class="loading">正在加载...</div>
    </div>

    <script>
        // 配置 marked
        marked.setOptions({
            breaks: true, // 自动换行
            gfm: true,    // 启用 GitHub Flavored Markdown
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            }
        });

        // 渲染 Markdown 文件
        async function renderMarkdownFile(filePath) {
            try {
                const response = await fetch(filePath);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const markdownText = await response.text();
                const htmlContent = marked.parse(markdownText);
                document.getElementById('markdown-content').innerHTML = htmlContent;
                
                // 为所有代码块添加高亮
                document.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightBlock(block);
                });
            } catch (error) {
                document.getElementById('markdown-content').innerHTML = 
                    `<div style="color: #d32f2f; padding: 20px;">
                        <h3>加载失败</h3>
                        <p>错误信息: ${error.message}</p>
                        <p>请检查文件路径: ${filePath}</p>
                    </div>`;
                console.error('渲染失败:', error);
            }
        }

        // 页面加载后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 从 URL 参数获取文件路径，或使用默认路径
            const urlParams = new URLSearchParams(window.location.search);
            const filePath = urlParams.get('file') || './logs/sss1.md';
            renderMarkdownFile(filePath);
        });
    </script>
</body>
</html>
